<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yewon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }

  /* 흰 종이가 뭉쳐져 구겨진 공 모양이 되도록 하는 텍스처.
     여러 겹의 radial-gradient로 밝고 어두운 주름 자국을 흩뿌리고,
     clip-path는 살짝 들쭉날쭉한 원(공 실루엣)으로 만든다. */
  .crumple-texture {
    background-color: #ffffff;
    background-image:
      radial-gradient(circle at 22% 18%, rgba(0,0,0,0.16) 0%, transparent 16%),
      radial-gradient(circle at 68% 12%, rgba(255,255,255,0.95) 0%, transparent 14%),
      radial-gradient(circle at 82% 32%, rgba(0,0,0,0.14) 0%, transparent 18%),
      radial-gradient(circle at 40% 40%, rgba(0,0,0,0.10) 0%, transparent 22%),
      radial-gradient(circle at 15% 55%, rgba(255,255,255,0.9) 0%, transparent 16%),
      radial-gradient(circle at 60% 62%, rgba(0,0,0,0.13) 0%, transparent 20%),
      radial-gradient(circle at 85% 72%, rgba(0,0,0,0.12) 0%, transparent 16%),
      radial-gradient(circle at 30% 82%, rgba(0,0,0,0.15) 0%, transparent 18%),
      radial-gradient(circle at 55% 90%, rgba(255,255,255,0.85) 0%, transparent 14%),
      linear-gradient(150deg, #ffffff, #eef0f2);
    background-blend-mode: multiply, screen, multiply, multiply, screen, multiply, multiply, multiply, screen, normal;
  }

  .crumple-ball-shape {
    clip-path: polygon(
      96% 50%, 98% 63%, 86% 71%, 84% 84%, 72% 88%, 63% 97%, 50% 91%,
      38% 95%, 25% 93%, 20% 80%, 10% 73%, 0% 63%, 8% 50%, 0% 38%,
      11% 28%, 15% 15%, 29% 13%, 38% 5%, 50% 9%, 63% 3%, 72% 12%,
      84% 16%, 86% 29%, 94% 38%
    );
  }

  .crumple-paper {
    position: fixed;
    z-index: 60;
    width: 70px;
    height: 70px;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.28));
    pointer-events: none;
    animation: crumple-toss 0.75s cubic-bezier(.5,-0.2,.7,1) forwards;
  }
  @keyframes crumple-toss {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
    25%  { transform: translate(calc(var(--tx) * 0.15), calc(var(--ty) * 0.1)) scale(0.85) rotate(-30deg); }
    60%  { transform: translate(calc(var(--tx) * 0.6), calc(var(--ty) * 0.5)) scale(0.5) rotate(260deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.12) rotate(600deg); opacity: 0; }
  }
  @keyframes trash-shake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-10deg); }
    40% { transform: rotate(8deg); }
    60% { transform: rotate(-6deg); }
    80% { transform: rotate(4deg); }
  }
  .trash-shake { animation: trash-shake 0.45s ease; }

  /* 종이가 손대는 만큼 실제로 구겨지는 것처럼 보이도록 하는 효과.
     4단계 모두 같은 '울퉁불퉁한 원' 실루엣(.crumple-ball-shape)을 쓰고,
     탭할 때마다 정사각형 크기만 점점 작아지면서 점점 더 동그랗게 뭉쳐지는 것처럼 보이게 한다. */
  .paper-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(150deg, #ffffff, #f4f5f7);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.4s ease, clip-path 0.4s ease, filter 0.4s ease, width 0.4s ease, height 0.4s ease, margin 0.4s ease;
  }
  .paper-wrap textarea {
    position: relative;
    z-index: 1;
    background: transparent;
  }
  .fold-line {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .fold-line-1 { background: radial-gradient(circle at 25% 20%, rgba(0,0,0,0.14), transparent 22%), radial-gradient(circle at 75% 15%, rgba(255,255,255,0.8), transparent 18%); }
  .fold-line-2 { background: radial-gradient(circle at 80% 35%, rgba(0,0,0,0.15), transparent 20%), radial-gradient(circle at 20% 55%, rgba(255,255,255,0.8), transparent 18%); }
  .fold-line-3 { background: radial-gradient(circle at 60% 65%, rgba(0,0,0,0.16), transparent 22%), radial-gradient(circle at 85% 75%, rgba(0,0,0,0.13), transparent 18%); }
  .fold-line-4 { background: radial-gradient(circle at 30% 85%, rgba(0,0,0,0.17), transparent 20%), radial-gradient(circle at 55% 92%, rgba(255,255,255,0.75), transparent 16%); }

  /* 4단계 모두 crumple-texture + crumple-ball-shape 클래스가 JS에서 함께 붙는다.
     여기서는 크기와 회전만 단계별로 다르게 준다. */
  .paper-stage-1 {
    width: 260px; height: 260px; margin: 0 auto;
    transform: rotate(-4deg);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
  }
  .paper-stage-1 .fold-line-1 { opacity: 1; }

  .paper-stage-2 {
    width: 215px; height: 215px; margin: 0 auto;
    transform: rotate(6deg);
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
  }
  .paper-stage-2 .fold-line-1, .paper-stage-2 .fold-line-2 { opacity: 1; }

  .paper-stage-3 {
    width: 185px; height: 185px; margin: 0 auto;
    transform: rotate(-5deg);
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.18));
  }
  .paper-stage-3 .fold-line-1, .paper-stage-3 .fold-line-2, .paper-stage-3 .fold-line-3 { opacity: 1; }

  .paper-stage-4 {
    width: 155px; height: 155px; margin: 0 auto;
    transform: rotate(5deg);
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.22));
    cursor: pointer;
  }
  .paper-stage-4 .fold-line-1, .paper-stage-4 .fold-line-2, .paper-stage-4 .fold-line-3, .paper-stage-4 .fold-line-4 { opacity: 1; }
</style>
</head>

<body class="bg-slate-50">

<script>
  const CONFIG = {
    // Google Cloud Console에서 발급받은 OAuth 2.0 클라이언트 ID (웹 애플리케이션)
    CLIENT_ID: "896977375631-gi4vc4qmhat4durcfjeurmes40847qr2.apps.googleusercontent.com",
  };
</script>
<!-- ================================================================= -->

<div id="header"></div>
<div class="flex flex-col md:flex-row min-h-screen">
  <div id="sidebar"></div>
  <div id="main" class="flex-1"></div>
</div>
<div id="focus-overlay" class="hidden fixed inset-0 bg-black/95 z-50 flex-col items-center justify-center text-white p-6"></div>

<script>
/* =========================================================
   상태 (State)
   ========================================================= */
const TODAY_YEAR = 2026, TODAY_MONTH = 7, TODAY_DAY = 26;
function dateKey(y, m, d) { return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function firstWeekdayOfMonth(y, m) { return new Date(y, m - 1, 1).getDay(); }
const TODAY_KEY = dateKey(TODAY_YEAR, TODAY_MONTH, TODAY_DAY);

let state = {
  accessToken: null,
  channel: null,               // { title, thumbnail }
  playlists: [],                // [{ id, title, thumbnail, itemCount }]
  playlistItems: {},            // playlistId -> [{ videoId, title, thumbnail }]
  openPlaylistId: null,         // 항목을 펼쳐서 보고 있는 재생목록
  focusPlaylistId: null,        // Focus Mode에서 재생할 재생목록
  viewYear: TODAY_YEAR,         // 캘린더에서 현재 보고 있는 연도
  viewMonth: TODAY_MONTH,       // 캘린더에서 현재 보고 있는 월
  selectedDate: TODAY_KEY,      // "YYYY-MM-DD" 형식
  songArchive: {
    [TODAY_KEY]: { videoId: "dQw4w9WgXcQ", title: "오늘 기록된 노래", recordedAt: "오늘 기록됨" },
  },
  todos: {
    [TODAY_KEY]: [
      { id: 1, time: "09:00", task: "아침 명상 및 노래 듣기", done: true },
      { id: 2, time: "13:00", task: "개인 프로젝트 코딩", done: false },
      { id: 3, time: "19:00", task: "작곡 연습 및 녹음", done: false },
    ],
  },
  ddays: [
    { id: 1, label: "단독 콘서트", date: "2026-09-12" },
    { id: 2, label: "2학기 중간고사", date: "2026-10-20" },
  ],
  activeTab: "planner",         // planner | archive | trash
  trashCount: 0,                 // 감정 쓰레기통에 버린 생각 개수
};

let tokenClient = null;
let timer = { durationMin: 25, secondsLeft: 25 * 60, running: false, intervalId: null };

/* =========================================================
   Google 로그인 (OAuth 2.0 / Google Identity Services)
   ========================================================= */
function initGoogleAuth() {
  if (!window.google || CONFIG.CLIENT_ID.startsWith("YOUR_")) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: "https://www.googleapis.com/auth/youtube.readonly",
    callback: async (tokenResponse) => {
      state.accessToken = tokenResponse.access_token;
      await fetchChannel();
      await fetchPlaylists();
      renderApp();
    },
  });
}
window.addEventListener("load", () => setTimeout(initGoogleAuth, 300));
window.addEventListener("load", () => loadYouTubeIframeApi());

function login() {
  if (CONFIG.CLIENT_ID.startsWith("YOUR_")) {
    alert("먼저 SETUP.md 안내에 따라 index.html의 CONFIG.CLIENT_ID를 본인의 구글 OAuth 클라이언트 ID로 바꿔주세요.");
    return;
  }
  if (!tokenClient) { initGoogleAuth(); }
  tokenClient?.requestAccessToken();
}

function logout() {
  if (state.accessToken) {
    google.accounts.oauth2.revoke(state.accessToken, () => {});
  }
  state = { ...state, accessToken: null, channel: null, playlists: [], playlistItems: {}, focusPlaylistId: null };
  renderApp();
}

/* =========================================================
   YouTube Data API v3 호출
   ========================================================= */
async function ytFetch(path) {
  const res = await fetch(`https://www.googleapis.com/youtube/v3/${path}`, {
    headers: { Authorization: `Bearer ${state.accessToken}` },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || "YouTube API 요청 실패");
  }
  return res.json();
}

async function fetchChannel() {
  try {
    const data = await ytFetch("channels?part=snippet&mine=true");
    const ch = data.items?.[0];
    if (ch) {
      state.channel = {
        title: ch.snippet.title,
        thumbnail: ch.snippet.thumbnails?.default?.url,
      };
    }
  } catch (e) {
    console.error(e);
  }
}

async function fetchPlaylists() {
  try {
    const data = await ytFetch("playlists?part=snippet,contentDetails&mine=true&maxResults=50");
    state.playlists = (data.items || []).map((item) => ({
      id: item.id,
      title: item.snippet.title,
      thumbnail: item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || "",
      itemCount: item.contentDetails.itemCount,
    }));
  } catch (e) {
    alert("재생목록을 불러오지 못했어요: " + e.message);
  }
}

async function fetchPlaylistItems(playlistId) {
  if (state.playlistItems[playlistId]) return state.playlistItems[playlistId];
  try {
    const data = await ytFetch(`playlistItems?part=snippet&maxResults=25&playlistId=${playlistId}`);
    const items = (data.items || []).map((item) => ({
      videoId: item.snippet.resourceId?.videoId,
      title: item.snippet.title,
      thumbnail: item.snippet.thumbnails?.default?.url || "",
    })).filter((i) => i.videoId);
    state.playlistItems[playlistId] = items;
    return items;
  } catch (e) {
    alert("재생목록 곡을 불러오지 못했어요: " + e.message);
    return [];
  }
}

/* =========================================================
   유틸
   ========================================================= */
function extractVideoId(input) {
  if (!input) return null;
  const t = input.trim();
  if (t.includes("watch?v=")) return t.split("v=")[1].split("&")[0];
  if (t.includes("youtu.be/")) return t.split("youtu.be/")[1].split("?")[0];
  if (t.includes("embed/")) return t.split("embed/")[1].split("?")[0];
  if (/^[a-zA-Z0-9_-]{11}$/.test(t)) return t;
  return null;
}
function formatMMSS(s) {
  const m = Math.floor(s / 60).toString().padStart(2, "0");
  const ss = Math.floor(s % 60).toString().padStart(2, "0");
  return `${m}:${ss}`;
}
function getDdayCount(dateStr) {
  const today = new Date(2026, 6, 26); today.setHours(0,0,0,0);
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
function escapeHtml(str = "") {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* =========================================================
   액션 (버튼 핸들러)
   ========================================================= */
function selectDate(day) { state.selectedDate = dateKey(state.viewYear, state.viewMonth, day); renderApp(); }
function selectDateFromKey(key) {
  const [y, m] = key.split("-").map(Number);
  state.viewYear = y;
  state.viewMonth = m;
  state.selectedDate = key;
  state.activeTab = "planner";
  renderApp();
}
function prevMonth() {
  state.viewMonth -= 1;
  if (state.viewMonth < 1) { state.viewMonth = 12; state.viewYear -= 1; }
  renderApp();
}
function nextMonth() {
  state.viewMonth += 1;
  if (state.viewMonth > 12) { state.viewMonth = 1; state.viewYear += 1; }
  renderApp();
}
function goToToday() {
  state.viewYear = TODAY_YEAR;
  state.viewMonth = TODAY_MONTH;
  state.selectedDate = TODAY_KEY;
  renderApp();
}
function setTab(tab) { state.activeTab = tab; renderApp(); }

function saveManualSong() {
  const input = document.getElementById("manual-song-input");
  const id = extractVideoId(input.value);
  if (!id) { alert("유효한 유튜브 링크를 입력해주세요."); return; }
  const [, sm, sd] = state.selectedDate.split("-").map(Number);
  state.songArchive[state.selectedDate] = {
    videoId: id, title: "직접 등록한 노래",
    recordedAt: `${sm}월 ${sd}일에 기록됨`,
  };
  input.value = "";
  renderApp();
}

async function togglePlaylistOpen(playlistId) {
  state.openPlaylistId = state.openPlaylistId === playlistId ? null : playlistId;
  renderApp();
  if (state.openPlaylistId) await fetchPlaylistItems(playlistId).then(renderApp);
}

function archiveFromPlaylist(videoId, title) {
  const [, am, ad] = state.selectedDate.split("-").map(Number);
  state.songArchive[state.selectedDate] = {
    videoId, title, recordedAt: `${am}월 ${ad}일에 기록됨`,
  };
  renderApp();
}

function setFocusPlaylist(playlistId) {
  state.focusPlaylistId = state.focusPlaylistId === playlistId ? null : playlistId;
  renderApp();
}

function addDday() {
  const label = document.getElementById("dday-label").value.trim();
  const date = document.getElementById("dday-date").value;
  if (!label || !date) return;
  state.ddays.push({ id: Date.now(), label, date });
  state.ddays.sort((a, b) => new Date(a.date) - new Date(b.date));
  document.getElementById("dday-label").value = "";
  document.getElementById("dday-date").value = "";
  renderApp();
}
function removeDday(id) {
  state.ddays = state.ddays.filter((d) => d.id !== id);
  renderApp();
}

function addTodo() {
  const timeInput = document.getElementById("todo-time");
  const taskInput = document.getElementById("todo-task");
  const task = taskInput.value.trim();
  if (!task) return;
  const list = state.todos[state.selectedDate] || (state.todos[state.selectedDate] = []);
  list.push({ id: Date.now(), time: timeInput.value, task, done: false });
  list.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  timeInput.value = "";
  taskInput.value = "";
  renderApp();
}
function removeTodo(id) {
  const list = state.todos[state.selectedDate] || [];
  state.todos[state.selectedDate] = list.filter((t) => t.id !== id);
  renderApp();
}
function toggleTodo(id) {
  const list = state.todos[state.selectedDate] || [];
  const item = list.find((t) => t.id === id);
  if (item) item.done = !item.done;
  renderApp();
}

/* =========================================================
   Focus Mode / 뽀모도로
   -----------------------------------------------------------
   예전 코드는 재생/일시정지, 시간 선택, 재생목록 선택을 누를 때마다
   focus-overlay의 innerHTML을 통째로 다시 그렸고, 그때마다 <iframe>이
   완전히 새로 생성됐어요. 브라우저(특히 크롬/사파리)는 이렇게
   "새로 삽입된" 외부(cross-origin) iframe에 대해서는, 그 순간이
   진짜 클릭과 동기적으로 연결되어 있지 않으면 소리가 나오는 자동재생을
   막아버립니다. 그래서 로그인도 되어 있고 영상 주소도 맞는데 소리/재생이
   안 되는 문제가 있었어요.

   지금은 YouTube IFrame Player API로 플레이어를 "한 번만" 만들고,
   시작/일시정지/구간 변경 버튼을 누를 때 그 플레이어 인스턴스의
   playVideo()/pauseVideo()를 직접 호출합니다. 버튼 클릭이 곧바로
   재생 요청으로 이어지기 때문에 오디오 자동재생 제한을 피할 수 있어요.
   (단, 재생목록이 "비공개(Private)"로 설정되어 있으면 유튜브 자체 정책상
   어떤 방식으로도 임베드 재생이 불가능해요 — 이 경우 재생목록을
   "공개" 또는 "일부 공개"로 바꿔주셔야 해요.)
   ========================================================= */
let ytPlayer = null;
let ytApiReady = false;
let ytPendingSource = null;

function loadYouTubeIframeApi() {
  if (window.YT && window.YT.Player) { ytApiReady = true; return; }
  if (document.getElementById("yt-iframe-api-script")) return;
  const tag = document.createElement("script");
  tag.id = "yt-iframe-api-script";
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady = function () {
  ytApiReady = true;
  if (ytPendingSource) {
    const src = ytPendingSource;
    ytPendingSource = null;
    createYtPlayer(src);
  }
};

function focusSource() {
  if (state.focusPlaylistId) return { type: "playlist", id: state.focusPlaylistId };
  const song = state.songArchive[state.selectedDate] || state.songArchive[TODAY_KEY];
  if (song) return { type: "video", id: song.videoId };
  return null;
}

function createYtPlayer(source) {
  const target = document.getElementById("yt-player-target");
  if (!target) return;
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    ytPlayer.destroy();
    ytPlayer = null;
  }
  const opts = {
    height: "100%",
    width: "100%",
    playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
    events: {
      onReady: (e) => { e.target.playVideo(); },
    },
  };
  if (source.type === "playlist") {
    opts.playerVars.listType = "playlist";
    opts.playerVars.list = source.id;
  } else {
    opts.videoId = source.id;
  }
  ytPlayer = new YT.Player("yt-player-target", opts);
}

function startOrSwitchPlayer() {
  const source = focusSource();
  if (!source) return;
  if (ytApiReady && window.YT && window.YT.Player) {
    createYtPlayer(source);
  } else {
    loadYouTubeIframeApi();
    ytPendingSource = source;
  }
}

function openFocusMode() {
  timer.secondsLeft = timer.durationMin * 60;
  timer.running = true;
  renderFocusOverlay();
  document.getElementById("focus-overlay").classList.remove("hidden");
  document.getElementById("focus-overlay").classList.add("flex");
  startTimerLoop();
  startOrSwitchPlayer();
}
function closeFocusMode() {
  timer.running = false;
  clearInterval(timer.intervalId);
  document.getElementById("focus-overlay").classList.add("hidden");
  document.getElementById("focus-overlay").classList.remove("flex");
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    ytPlayer.destroy();
    ytPlayer = null;
  }
}
function setFocusDuration(min) {
  timer.durationMin = min;
  timer.secondsLeft = min * 60;
  timer.running = false;
  clearInterval(timer.intervalId);
  if (ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
  updateFocusControls();
}
function toggleTimer() {
  timer.running = !timer.running;
  if (timer.running) {
    startTimerLoop();
    if (ytPlayer && typeof ytPlayer.playVideo === "function") ytPlayer.playVideo();
    else startOrSwitchPlayer();
  } else {
    clearInterval(timer.intervalId);
    if (ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
  }
  updateFocusControls();
}
function resetTimer() {
  timer.running = false;
  clearInterval(timer.intervalId);
  timer.secondsLeft = timer.durationMin * 60;
  if (ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
  updateFocusControls();
}
function startTimerLoop() {
  clearInterval(timer.intervalId);
  timer.intervalId = setInterval(() => {
    if (!timer.running) return;
    timer.secondsLeft = Math.max(0, timer.secondsLeft - 1);
    const el = document.getElementById("focus-timer-display");
    if (el) el.textContent = formatMMSS(timer.secondsLeft);
    if (timer.secondsLeft === 0) {
      timer.running = false;
      clearInterval(timer.intervalId);
      if (ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
      updateFocusControls();
    }
  }, 1000);
}
function selectFocusPlaylistInOverlay(id) {
  state.focusPlaylistId = id || null;
  renderFocusOverlay();
  startOrSwitchPlayer();
}

function updateFocusControls() {
  const timerEl = document.getElementById("focus-timer-display");
  if (timerEl) timerEl.textContent = formatMMSS(timer.secondsLeft);

  document.querySelectorAll("[data-duration-btn]").forEach((btn) => {
    const m = Number(btn.dataset.durationBtn);
    btn.className = `px-4 py-2 rounded-full text-sm transition ${timer.durationMin === m ? "bg-indigo-600" : "bg-slate-800 hover:bg-slate-700"}`;
  });

  const toggleBtn = document.getElementById("focus-toggle-btn");
  if (toggleBtn) {
    toggleBtn.innerHTML = `<i data-lucide="${timer.running ? "pause" : "play"}" class="w-4 h-4"></i> ${timer.running ? "일시정지" : "시작"}`;
    if (window.lucide) lucide.createIcons();
  }
}

              <button id="crumple-btn" onclick="tapPaper()" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-gray-900 text-white text-sm font-medium hover:bg-gray-800 transition">
                <i data-lucide="hand" class="w-4 h-4"></i> 구기기 (0/4)
              </button>
            </div>
          </div>
          <div class="flex justify-center mt-10">
            <div id="trash-bin-icon" onclick="throwCrumpledPaper()" title="구겨진 종이를 여기로 던지기"
              class="cursor-pointer transition hover:scale-105 active:scale-95">
              <svg width="118" height="128" viewBox="0 0 118 128" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="59" cy="120" rx="36" ry="6" fill="#0f172a" opacity="0.08"/>
                <rect x="46" y="4" width="26" height="12" rx="4" fill="#334155"/>
                <rect x="20" y="16" width="78" height="14" rx="6" fill="#334155"/>
                <path d="M28 32 L34 112 Q35 118 41 118 H77 Q83 118 84 112 L90 32 Z" fill="#475569"/>
                <path d="M28 32 L34 112 Q35 118 41 118 H59 V32 Z" fill="#64748b"/>
                <line x1="46" y1="44" x2="49" y2="104" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                <line x1="59" y1="44" x2="59" y2="104" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                <line x1="72" y1="44" x2="69" y2="104" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <p class="text-center text-xs text-gray-300 mt-3">적은 내용은 저장되지 않고 버리는 순간 그대로 사라져요.</p>
        </div>
      </main>`;
  }
}

/* =========================================================
   감정 쓰레기통 (Emotion Trash Bin)
   ========================================================= */
let paperTapCount = 0;

function tapPaper() {
  const textarea = document.getElementById("trash-note-input");
  const wrap = document.getElementById("paper-wrap");
  if (!textarea || !wrap || !textarea.value.trim()) return;
  if (paperTapCount >= 4) { throwCrumpledPaper(); return; }
  paperTapCount += 1;
  wrap.className = `paper-wrap paper-stage-${paperTapCount} crumple-texture crumple-ball-shape`;
  if (paperTapCount === 4) textarea.readOnly = true;
  updateCrumpleUi();
}

function updateCrumpleUi() {
  const btn = document.getElementById("crumple-btn");
  const hint = document.getElementById("crumple-hint");
  if (btn) {
    btn.innerHTML = paperTapCount >= 4
      ? `<i data-lucide="trash-2" class="w-4 h-4"></i> 쓰레기통에 넣기`
      : `<i data-lucide="hand" class="w-4 h-4"></i> 구기기 (${paperTapCount}/4)`;
  }
  if (hint) {
    hint.textContent = paperTapCount >= 4
      ? "다 구겨졌어요! 종이나 쓰레기통을 눌러 넣어보세요"
      : paperTapCount === 0
        ? "다 적었다면 종이를 눌러서 구겨보세요"
        : `조금씩 구겨지고 있어요 (${paperTapCount}/4)`;
  }
  if (window.lucide) lucide.createIcons();
}

function throwCrumpledPaper() {
  const textarea = document.getElementById("trash-note-input");
  const wrap = document.getElementById("paper-wrap");
  if (!textarea) return;
  const text = textarea.value.trim();
  if (!text) return;

  const binEl = document.getElementById("trash-bin-icon");
  const rect = (wrap || textarea).getBoundingClientRect();

  const paper = document.createElement("div");
  paper.className = "crumple-paper crumple-texture crumple-ball-shape";
  const ballSize = 70;
  paper.style.left = (rect.left + rect.width / 2 - ballSize / 2) + "px";
  paper.style.top = (rect.top + rect.height / 2 - ballSize / 2) + "px";

  if (binEl) {
    const binRect = binEl.getBoundingClientRect();
    const tx = (binRect.left + binRect.width / 2) - (rect.left + rect.width / 2);
    const ty = (binRect.top + binRect.height / 2) - (rect.top + rect.height / 2);
    paper.style.setProperty("--tx", tx + "px");
    paper.style.setProperty("--ty", ty + "px");
  } else {
    paper.style.setProperty("--tx", "0px");
    paper.style.setProperty("--ty", "300px");
  }

  document.body.appendChild(paper);
  paper.addEventListener("animationend", () => paper.remove());

  if (binEl) {
    binEl.classList.remove("trash-shake");
    void binEl.offsetWidth; // reflow to restart animation
    binEl.classList.add("trash-shake");
    setTimeout(() => binEl.classList.remove("trash-shake"), 450);
  }

  textarea.value = "";
  textarea.readOnly = false;
  if (wrap) wrap.className = "paper-wrap paper-stage-0";
  paperTapCount = 0;
  updateCrumpleUi();

  state.trashCount = (state.trashCount || 0) + 1;
  const countLabel = document.getElementById("trash-count-label");
  if (countLabel) countLabel.textContent = `오늘 ${state.trashCount}개의 생각을 버렸어요`;
}


renderApp();
</script>
