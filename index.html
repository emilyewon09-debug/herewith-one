<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yewon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }

  /* 종이가 구겨지며 날아가는 애니메이션 수정 */
  .crumple-paper {
    position: fixed;
    z-index: 60;
    background: linear-gradient(135deg, #fffdf7, #e8dcc4);
    padding: 12px;
    font-size: 11px;
    line-height: 1.4;
    color: #7a6a4d;
    overflow: hidden;
    box-shadow: 
      inset 0 0 15px rgba(0, 0, 0, 0.15), 
      0 6px 16px rgba(0, 0, 0, 0.15);
    pointer-events: none;
    transform-origin: center center;
    animation: crumple-toss 1s ease-in-out forwards;
  }

  @keyframes crumple-toss {
    0% {
      transform: scale(1) rotate(0deg);
      border-radius: 0px;
      opacity: 1;
    }
    30% {
      transform: scale(0.6) rotate(15deg);
      border-radius: 20% 30% 25% 40%;
      box-shadow: 
        inset 10px 10px 20px rgba(0, 0, 0, 0.3),
        inset -10px -10px 20px rgba(0, 0, 0, 0.2);
      opacity: 1;
    }
    60% {
      transform: translate(calc(var(--tx) * 0.3), calc(var(--ty) * 0.3)) scale(0.3) rotate(90deg);
      border-radius: 40% 50% 45% 55%;
      box-shadow: inset 15px 15px 25px rgba(0, 0, 0, 0.4);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg);
      opacity: 0;
    }
  }

  @keyframes trash-shake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-10deg); }
    40% { transform: rotate(8deg); }
    60% { transform: rotate(-6deg); }
    80% { transform: rotate(4deg); }
  }
  .trash-shake { animation: trash-shake 0.45s ease; }

  .paper-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(135deg, #fffdf7, #fdf6e3);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.4s ease, clip-path 0.4s ease, box-shadow 0.4s ease, filter 0.4s ease;
    clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
  }
  .paper-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 26px, rgba(217,199,158,0.3) 27px);
  }
  .paper-wrap textarea {
    position: relative;
    z-index: 1;
    background: transparent;
  }
  .fold-line {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .fold-line-1 { background: linear-gradient(115deg, transparent 44%, rgba(120,100,60,0.22) 50%, transparent 56%); }
  .fold-line-2 { background: linear-gradient(15deg, transparent 44%, rgba(120,100,60,0.24) 50%, transparent 56%); }
  .fold-line-3 { background: linear-gradient(160deg, transparent 43%, rgba(90,75,45,0.26) 50%, transparent 57%); }
  .fold-line-4 { background: linear-gradient(70deg, transparent 42%, rgba(70,55,30,0.3) 50%, transparent 58%); }

  .paper-stage-1 {
    transform: rotate(-1.5deg) scale(0.96);
    filter: contrast(1.03);
    box-shadow: inset 0 0 16px rgba(120,100,60,0.12), 0 3px 8px rgba(0,0,0,0.08);
    clip-path: polygon(3% 0%, 100% 2%, 98% 96%, 4% 100%, 0% 55%);
  }
  .paper-stage-1 .fold-line-1 { opacity: 1; }

  .paper-stage-2 {
    transform: rotate(2deg) scale(0.9);
    filter: contrast(1.07) brightness(0.99);
    box-shadow: inset 0 0 24px rgba(120,100,60,0.2), 0 4px 10px rgba(0,0,0,0.1);
    clip-path: polygon(4% 2%, 60% 0%, 96% 0%, 100% 40%, 92% 55%, 100% 96%, 6% 100%, 0% 60%, 8% 30%);
  }
  .paper-stage-2 .fold-line-1, .paper-stage-2 .fold-line-2 { opacity: 1; }

  .paper-stage-3 {
    transform: rotate(-3deg) scale(0.82);
    filter: contrast(1.11) brightness(0.97);
    box-shadow: inset 0 0 30px rgba(120,100,60,0.28), 0 6px 14px rgba(0,0,0,0.13);
    clip-path: polygon(6% 4%, 55% 0%, 92% 3%, 100% 30%, 88% 45%, 100% 65%, 90% 85%, 96% 100%, 40% 96%, 10% 100%, 0% 70%, 10% 45%, 0% 25%);
  }
  .paper-stage-3 .fold-line-1, .paper-stage-3 .fold-line-2, .paper-stage-3 .fold-line-3 { opacity: 1; }

  .paper-stage-4 {
    transform: rotate(4deg) scale(0.68);
    filter: contrast(1.16) brightness(0.93);
    box-shadow: inset 0 0 38px rgba(120,100,60,0.36), 0 8px 18px rgba(0,0,0,0.16);
    clip-path: polygon(8% 6%, 45% 0%, 78% 4%, 100% 20%, 90% 38%, 100% 55%, 82% 68%, 100% 85%, 70% 100%, 45% 92%, 20% 100%, 5% 80%, 15% 58%, 0% 40%, 12% 20%);
    cursor: pointer;
  }
  .paper-stage-4 .fold-line-1, .paper-stage-4 .fold-line-2, .paper-stage-4 .fold-line-3, .paper-stage-4 .fold-line-4 { opacity: 1; }
</style>
</head>
<body class="bg-slate-50">

<script>
  const CONFIG = {
    CLIENT_ID: "Y896977375631-gi4vc4qmhat4durcfjeurmes40847qr2.apps.googleusercontent.com",
  };
</script>

<div id="header"></div>
<div class="flex flex-col md:flex-row min-h-screen">
  <div id="sidebar"></div>
  <div id="main" class="flex-1"></div>
</div>
<div id="focus-overlay" class="hidden fixed inset-0 bg-black/95 z-50 flex-col items-center justify-center text-white p-6"></div>

<script>
const TODAY_YEAR = 2026, TODAY_MONTH = 7, TODAY_DAY = 26;
function dateKey(y, m, d) { return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function firstWeekdayOfMonth(y, m) { return new Date(y, m - 1, 1).getDay(); }
const TODAY_KEY = dateKey(TODAY_YEAR, TODAY_MONTH, TODAY_DAY);

let state = {
  accessToken: null,
  channel: null,
  playlists: [],
  playlistItems: {},
  openPlaylistId: null,
  focusPlaylistId: null,
  viewYear: TODAY_YEAR,
  viewMonth: TODAY_MONTH,
  selectedDate: TODAY_KEY,
  songArchive: {
    [TODAY_KEY]: { videoId: "dQw4w9WgXcQ", title: "오늘 기록된 노래", recordedAt: "오늘 기록됨" },
  },
  ddays: [
    { id: 1, label: "단독 콘서트", date: "2026-09-12" },
    { id: 2, label: "2학기 중간고사", date: "2026-10-20" },
  ],
  activeTab: "planner",
  trashCount: 0,
};

let tokenClient = null;
let timer = { durationMin: 25, secondsLeft: 25 * 60, running: false, intervalId: null };

function initGoogleAuth() {
  if (!window.google || CONFIG.CLIENT_ID.startsWith("YOUR_")) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: "https://www.googleapis.com/auth/youtube.readonly",
    callback: async (tokenResponse) => {
      state.accessToken = tokenResponse.access_token;
      await fetchChannel();
      await fetchPlaylists();
      renderApp();
    },
  });
}
window.addEventListener("load", () => setTimeout(initGoogleAuth, 300));
window.addEventListener("load", () => loadYouTubeIframeApi());

function login() {
  if (CONFIG.CLIENT_ID.startsWith("YOUR_")) {
    alert("먼저 SETUP.md 안내에 따라 index.html의 CONFIG.CLIENT_ID를 본인의 구글 OAuth 클라이언트 ID로 바꿔주세요.");
    return;
  }
  if (!tokenClient) { initGoogleAuth(); }
  tokenClient?.requestAccessToken();
}

function logout() {
  if (state.accessToken) {
    google.accounts.oauth2.revoke(state.accessToken, () => {});
  }
  state = { ...state, accessToken: null, channel: null, playlists: [], playlistItems: {}, focusPlaylistId: null };
  renderApp();
}

async function ytFetch(path) {
  const res = await fetch(`https://www.googleapis.com/youtube/v3/${path}`, {
    headers: { Authorization: `Bearer ${state.accessToken}` },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || "YouTube API 요청 실패");
  }
  return res.json();
}

async function fetchChannel() {
  try {
    const data = await ytFetch("channels?part=snippet&mine=true");
    const ch = data.items?.[0];
    if (ch) {
      state.channel = {
        title: ch.snippet.title,
        thumbnail: ch.snippet.thumbnails?.default?.url,
      };
    }
  } catch (e) {
    console.error(e);
  }
}

async function fetchPlaylists() {
  try {
    const data = await ytFetch("playlists?part=snippet,contentDetails&mine=true&maxResults=50");
    state.playlists = (data.items || []).map((item) => ({
      id: item.id,
      title: item.snippet.title,
      thumbnail: item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || "",
      itemCount: item.contentDetails.itemCount,
    }));
  } catch (e) {
    alert("재생목록을 불러오지 못했어요: " + e.message);
  }
}

async function fetchPlaylistItems(playlistId) {
  if (state.playlistItems[playlistId]) return state.playlistItems[playlistId];
  try {
    const data = await ytFetch(`playlistItems?part=snippet&maxResults=25&playlistId=${playlistId}`);
    const items = (data.items || []).map((item) => ({
      videoId: item.snippet.resourceId?.videoId,
      title: item.snippet.title,
      thumbnail: item.snippet.thumbnails?.default?.url || "",
    })).filter((i) => i.videoId);
    state.playlistItems[playlistId] = items;
    return items;
  } catch (e) {
    alert("재생목록 곡을 불러오지 못했어요: " + e.message);
    return [];
  }
}

function extractVideoId(input) {
  if (!input) return null;
  const t = input.trim();
  if (t.includes("watch?v=")) return t.split("v=")[1].split("&")[0];
  if (t.includes("youtu.be/")) return t.split("youtu.be/")[1].split("?")[0];
  if (t.includes("embed/")) return t.split("embed/")[1].split("?")[0];
  if (/^[a-zA-Z0-9_-]{11}$/.test(t)) return t;
  return null;
}
function formatMMSS(s) {
  const m = Math.floor(s / 60).toString().padStart(2, "0");
  const ss = Math.floor(s % 60).toString().padStart(2, "0");
  return `${m}:${ss}`;
}
function getDdayCount(dateStr) {
  const today = new Date(2026, 6, 26); today.setHours(0,0,0,0);
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
function escapeHtml(str = "") {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function selectDate(day) { state.selectedDate = dateKey(state.viewYear, state.viewMonth, day); renderApp(); }
function selectDateFromKey(key) {
  const [y, m] = key.split("-").map(Number);
  state.viewYear = y;
  state.viewMonth = m;
  state.selectedDate = key;
  state.activeTab = "planner";
  renderApp();
}
function prevMonth() {
  state.viewMonth -= 1;
  if (state.viewMonth < 1) { state.viewMonth = 12; state.viewYear -= 1; }
  renderApp();
}
function nextMonth() {
  state.viewMonth += 1;
  if (state.viewMonth > 12) { state.viewMonth = 1; state.viewYear += 1; }
  renderApp();
}
function goToToday() {
  state.viewYear = TODAY_YEAR;
  state.viewMonth = TODAY_MONTH;
  state.selectedDate = TODAY_KEY;
  renderApp();
}
function setTab(tab) { state.activeTab = tab; renderApp(); }

function saveManualSong() {
  const input = document.getElementById("manual-song-input");
  const id = extractVideoId(input.value);
  if (!id) { alert("유효한 유튜브 링크를 입력해주세요."); return; }
  const [, sm, sd] = state.selectedDate.split("-").map(Number);
  state.songArchive[state.selectedDate] = {
    videoId: id, title: "직접 등록한 노래",
    recordedAt: `${sm}월 ${sd}일에 기록됨`,
  };
  input.value = "";
  renderApp();
}

async function togglePlaylistOpen(playlistId) {
  state.openPlaylistId = state.openPlaylistId === playlistId ? null : playlistId;
  renderApp();
  if (state.openPlaylistId) await fetchPlaylistItems(playlistId).then(renderApp);
}

function archiveFromPlaylist(videoId, title) {
  const [, am, ad] = state.selectedDate.split("-").map(Number);
  state.songArchive[state.selectedDate] = {
    videoId, title, recordedAt: `${am}월 ${ad}일에 기록됨`,
  };
  renderApp();
}

function setFocusPlaylist(playlistId) {
  state.focusPlaylistId = state.focusPlaylistId === playlistId ? null : playlistId;
  renderApp();
}

function addDday() {
  const label = document.getElementById("dday-label").value.trim();
  const date = document.getElementById("dday-date").value;
  if (!label || !date) return;
  state.ddays.push({ id: Date.now(), label, date });
  state.ddays.sort((a, b) => new Date(a.date) - new Date(b.date));
  document.getElementById("dday-label").value = "";
  document.getElementById("dday-date").value = "";
  renderApp();
}
function removeDday(id) {
  state.ddays = state.ddays.filter((d) => d.id !== id);
  renderApp();
}

let ytPlayer = null;
let ytApiReady = false;
let ytPendingSource = null;

function loadYouTubeIframeApi() {
  if (window.YT && window.YT.Player) { ytApiReady = true; return; }
  if (document.getElementById("yt-iframe-api-script")) return;
  const tag = document.createElement("script");
  tag.id = "yt-iframe-api-script";
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady = function () {
  ytApiReady = true;
  if (ytPendingSource) {
    const src = ytPendingSource;
    ytPendingSource = null;
    createYtPlayer(src);
  }
};

function focusSource() {
  if (state.focusPlaylistId) return { type: "playlist", id: state.focusPlaylistId };
  const song = state.songArchive[state.selectedDate] || state.songArchive[TODAY_KEY];
  if (song) return { type: "video", id: song.videoId };
  return null;
}

function createYtPlayer(source) {
  const target = document.getElementById("yt-player-target");
  if (!target) return;
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    ytPlayer.destroy();
    ytPlayer = null;
  }
  const opts = {
    height: "100%",
    width: "100%",
    playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
    events: {
      onReady: (e) => { e.target.playVideo(); },
    },
  };
  if (source.type === "playlist") {
    opts.playerVars.listType = "playlist";
    opts.playerVars.list = source.id;
  } else {
    opts.videoId = source.id;
  }
  ytPlayer = new YT.Player("yt-player-target", opts);
}

function startOrSwitchPlayer() {
  const source = focusSource();
  if (!source) return;
  if (ytApiReady && window.YT && window.YT.Player) {
    createYtPlayer(source);
  } else {
    loadYouTubeIframeApi();
    ytPendingSource = source;
  }
}

function openFocusMode() {
  timer.secondsLeft = timer.durationMin * 60;
  timer.running = true;
  renderFocusOverlay();
  document.getElementById("focus-overlay").classList.remove("hidden");
  document.getElementById("focus-overlay").classList.add("flex");
  startTimerLoop();
  startOrSwitchPlayer();
}
function closeFocusMode() {
  timer.running = false;
  clearInterval(timer.intervalId);
  document.getElementById("focus-overlay").classList.add("hidden");
  document.getElementById("focus-overlay").classList.remove("flex");
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    ytPlayer.destroy();
    ytPlayer = null;
  }
}
function setFocusDuration(min) {
  timer.durationMin = min;
  timer.secondsLeft = min * 60;
  timer.running = false;
  clearInterval(timer.intervalId);
  if (ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
  updateFocusControls();
}
function toggleTimer() {
  timer.running = !timer.running;
  if (timer.running) {
    startTimerLoop();
    if (ytPlayer && typeof ytPlayer.playVideo === "function") ytPlayer.playVideo();
    else startOrSwitchPlayer();
  } else {
    clearInterval(timer.intervalId);
    if (ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
  }
  updateFocusControls();
}
function resetTimer() {
  timer.running = false;
  clearInterval(timer.intervalId);
  timer.secondsLeft = timer.durationMin * 60;
  if (ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
  updateFocusControls();
}
function startTimerLoop() {
  clearInterval(timer.intervalId);
  timer.intervalId = setInterval(() => {
    if (!timer.running) return;
    timer.secondsLeft = Math.max(0, timer.secondsLeft - 1);
    const el = document.getElementById("focus-timer-display");
    if (el) el.textContent = formatMMSS(timer.secondsLeft);
    if (timer.secondsLeft === 0) {
      timer.running = false;
      clearInterval(timer.intervalId);
      if (ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
      updateFocusControls();
    }
  }, 1000);
}
function selectFocusPlaylistInOverlay(id) {
  state.focusPlaylistId = id || null;
  renderFocusOverlay();
  startOrSwitchPlayer();
}

function updateFocusControls() {
  const timerEl = document.getElementById("focus-timer-display");
  if (timerEl) timerEl.textContent = formatMMSS(timer.secondsLeft);

  document.querySelectorAll("[data-duration-btn]").forEach((btn) => {
    const m = Number(btn.dataset.durationBtn);
    btn.className = `px-4 py-2 rounded-full text-sm transition ${timer.durationMin === m ? "bg-indigo-600" : "bg-slate-800 hover:bg-slate-700"}`;
  });

  const toggleBtn = document.getElementById("focus-toggle-btn");
  if (toggleBtn) {
    toggleBtn.innerHTML = `<i data-lucide="${timer.running ? "pause" : "play"}" class="w-4 h-4"></i> ${timer.running ? "일시정지" : "시작"}`;
    if (window.lucide) lucide.createIcons();
  }
}

function renderFocusOverlay() {
  const source = focusSource();
  const [, foM, foD] = state.selectedDate.split("-").map(Number);
  const playlistOptions = state.playlists.map(
    (p) => `<option value="${p.id}" ${state.focusPlaylistId === p.id ? "selected" : ""}>${escapeHtml(p.title)}</option>`
  ).join("");

  document.getElementById("focus-overlay").innerHTML = `
    <button onclick="closeFocusMode()" class="absolute top-6 right-6 text-gray-400 hover:text-white transition">
      <i data-lucide="x" class="w-7 h-7"></i>
    </button>
    <p class="text-xs uppercase tracking-widest text-indigo-400 mb-2">Focus Mode</p>
    <h2 id="focus-timer-display" class="text-7xl font-mono font-bold mb-6">${formatMMSS(timer.secondsLeft)}</h2>

    ${state.playlists.length > 0 ? `
      <select onchange="selectFocusPlaylistInOverlay(this.value)" class="mb-4 text-sm bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-white">
        <option value="">노래 하나만 재생 (${foM}월 ${foD}일 기록)</option>
        ${playlistOptions}
      </select>` : `<p class="text-xs text-gray-500 mb-4">로그인하면 내 재생목록으로 재생할 수 있어요</p>`}

    ${source ? `
      <div id="yt-player-target" class="w-full max-w-md aspect-video mb-2 rounded-xl overflow-hidden opacity-90 bg-slate-800"></div>
      <p class="text-[11px] text-gray-500 mb-6">소리가 나오지 않으면 영상을 한 번 눌러주세요 · 재생목록은 '공개'나 '일부 공개'여야 재생돼요</p>`
      : `<p class="text-sm text-gray-500 mb-6">재생할 노래나 재생목록이 없어요</p>`}

    <div class="flex items-center gap-3 mb-8">
      ${[25, 45, 60].map((m) => `
        <button data-duration-btn="${m}" onclick="setFocusDuration(${m})" class="px-4 py-2 rounded-full text-sm transition ${timer.durationMin === m ? "bg-indigo-600" : "bg-slate-800 hover:bg-slate-700"}">${m}분</button>
      `).join("")}
    </div>

    <div class="flex items-center gap-4">
      <button id="focus-toggle-btn" onclick="toggleTimer()" class="flex items-center gap-2 px-6 py-3 rounded-full bg-indigo-600 hover:bg-indigo-500 transition font-medium">
        <i data-lucide="${timer.running ? "pause" : "play"}" class="w-4 h-4"></i> ${timer.running ? "일시정지" : "시작"}
      </button>
      <button onclick="resetTimer()" class="px-6 py-3 rounded-full bg-slate-800 hover:bg-slate-700 transition font-medium">초기화</button>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
}

function renderApp() {
  renderHeader();
  renderSidebar();
  renderMain();
  if (window.lucide) lucide.createIcons();
}

function renderHeader() {
  document.getElementById("header").innerHTML = `
    <div class="hidden"></div>
  `;
}

function renderSidebar() {
  const loggedIn = !!state.accessToken;
  const [sbY, sbM, sbD] = state.selectedDate.split("-").map(Number);

  const playlistListHtml = state.playlists.map((p) => `
    <div class="border border-gray-100 rounded-xl overflow-hidden">
      <button onclick="togglePlaylistOpen('${p.id}')" class="w-full flex items-center gap-2 p-2 text-left hover:bg-gray-50">
        <img src="${p.thumbnail}" class="w-10 h-10 rounded object-cover shrink-0" />
        <span class="flex-1 min-w-0">
          <span class="block text-xs font-medium text-gray-700 truncate">${escapeHtml(p.title)}</span>
          <span class="block text-[10px] text-gray-400">${p.itemCount}곡</span>
        </span>
        <button onclick="event.stopPropagation(); setFocusPlaylist('${p.id}')"

function renderMain() {

        </div>
        <div class="max-w-xl mx-auto">

                <line x1="72" y1="44" x2="69" y2="104" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

let paperTapCount = 0;

function tapPaper() {
  const textarea = document.getElementById("trash-note-input");
  const wrap = document.getElementById("paper-wrap");
  if (!textarea || !wrap || !textarea.value.trim()) return;
  if (paperTapCount >= 4) { throwCrumpledPaper(); return; }
  paperTapCount += 1;
  wrap.className = `paper-wrap paper-stage-${paperTapCount}`;
  if (paperTapCount === 4) textarea.readOnly = true;
  updateCrumpleUi();
}

function updateCrumpleUi() {
  const btn = document.getElementById("crumple-btn");
  const hint = document.getElementById("crumple-hint");
  if (btn) {
    btn.innerHTML = paperTapCount >= 4
      ? `<i data-lucide="trash-2" class="w-4 h-4"></i> 쓰레기통에 넣기`
      : `<i data-lucide="hand" class="w-4 h-4"></i> 구기기 (${paperTapCount}/4)`;
  }
  if (hint) {
    hint.textContent = paperTapCount >= 4
      ? "다 구겨졌어요! 종이나 쓰레기통을 눌러 넣어보세요"
      : paperTapCount === 0
        ? "다 적었다면 종이를 눌러서 구겨보세요"
        : `조금씩 구겨지고 있어요 (${paperTapCount}/4)`;
  }
  if (window.lucide) lucide.createIcons();
}

function throwCrumpledPaper() {
  const textarea = document.getElementById("trash-note-input");
  const wrap = document.getElementById("paper-wrap");
  if (!textarea) return;
  const text = textarea.value.trim();
  if (!text) return;

  const binEl = document.getElementById("trash-bin-icon");
  const rect = (wrap || textarea).getBoundingClientRect();

  const paper = document.createElement("div");
  paper.className = "crumple-paper";
  paper.style.left = rect.left + "px";
  paper.style.top = rect.top + "px";
  paper.style.width = Math.min(rect.width, 260) + "px";
  paper.textContent = text.slice(0, 120);

  if (binEl) {
    const binRect = binEl.getBoundingClientRect();
    const tx = (binRect.left + binRect.width / 2) - (rect.left + Math.min(rect.width, 260) / 2);
    const ty = (binRect.top + binRect.height / 2) - rect.top;
    paper.style.setProperty("--tx", tx + "px");
    paper.style.setProperty("--ty", ty + "px");
  } else {
    paper.style.setProperty("--tx", "0px");
    paper.style.setProperty("--ty", "300px");
  }

  document.body.appendChild(paper);
  paper.addEventListener("animationend", () => paper.remove());

  if (binEl) {
    binEl.classList.remove("trash-shake");
    void binEl.offsetWidth;
    binEl.classList.add("trash-shake");
    setTimeout(() => binEl.classList.remove("trash-shake"), 450);
  }

  textarea.value = "";
  textarea.readOnly = false;
  if (wrap) wrap.className = "paper-wrap paper-stage-0";
  paperTapCount = 0;
  updateCrumpleUi();

  state.trashCount = (state.trashCount || 0) + 1;
  const countLabel = document.getElementById("trash-count-label");
  if (countLabel) countLabel.textContent = `오늘 ${state.trashCount}개의 생각을 버렸어요`;
}

renderApp();
</script>
